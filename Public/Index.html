<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EcoMath Mentor</title>
  <style>
    body {
      margin: 0;
      font: 16px/1.5 system-ui, sans-serif;
      color: #192a3a;
      background: #f3f6fa;
    }
    main { max-width: 850px; margin: auto; padding: 1rem; }
    header { background: #17324d; color: white; padding: 1.2rem; }
    header h1, header p { max-width: 850px; margin: .2rem auto; }
    #chat {
      background: white; border: 1px solid #ccd6e0; border-radius: 12px;
      padding: 1rem; min-height: 300px; margin: 1rem 0; overflow-wrap: anywhere;
    }
    .message { padding: .8rem; margin: .6rem 0; border-radius: 8px; }
    .user { background: #e8f1fa; }
    .assistant { background: #f1f5f2; }
    label { display: block; font-weight: 700; margin-bottom: .4rem; }
    textarea {
      width: 100%; min-height: 110px; padding: .7rem;
      font: inherit; border: 1px solid #8495a7; border-radius: 8px;
      box-sizing: border-box;
    }
    button {
      margin-top: .7rem; padding: .7rem 1rem; min-height: 44px;
      border: 0; border-radius: 8px; color: white; background: #1769aa;
      font: inherit; font-weight: 700; cursor: pointer;
    }
    button:focus-visible, textarea:focus-visible {
      outline: 3px solid #e5a900; outline-offset: 2px;
    }
    .hint { color: #536579; }
  </style>
</head>
<body>
  <header>
    <h1>EcoMath Mentor</h1>
    <p>Matemáticas para entender decisiones económicas.</p>
  </header>

  <main>
    <p class="hint">
      Escribe una pregunta o pega un problema de precálculo, cálculo diferencial
      o cálculo integral. En tareas, el mentor te guiará paso a paso.
    </p>

    <section id="chat" aria-live="polite" aria-label="Conversación"></section>

    <form id="form">
      <label for="question">Tu pregunta o problema</label>
      <textarea id="question" required maxlength="6000"
        placeholder="Ejemplo: Una empresa tiene una función de costo..."></textarea>
      <button id="send" type="submit">Enviar</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
  </main>

  <script>
    const form = document.querySelector("#form");
    const input = document.querySelector("#question");
    const chat = document.querySelector("#chat");
    const status = document.querySelector("#status");
    const send = document.querySelector("#send");
    const messages = [];

    function addMessage(role, text) {
      const box = document.createElement("div");
      box.className = `message ${role}`;
      const label = document.createElement("strong");
      label.textContent = role === "user" ? "Tú: " : "EcoMath Mentor: ";
      const body = document.createElement("span");
      body.textContent = text;
      box.append(label, body);
      chat.append(box);
      box.scrollIntoView({ behavior: "smooth", block: "end" });
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      messages.push({ role: "user", content: text });
      addMessage("user", text);
      input.value = "";
      send.disabled = true;
      status.textContent = "EcoMath Mentor está pensando…";

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Ocurrió un error.");

        messages.push({ role: "assistant", content: data.answer });
        addMessage("assistant", data.answer);
        status.textContent = "";
      } catch (error) {
        status.textContent = error.message;
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
